server:
  port: 8082

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/menudb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT configuration — used to validate tokens issued by user-service
jwt:
  secret: ${JWT_SECRET:S3cr3tK3yF0rJWTAuthThatIsAtLeast256BitsL0ng!!Change-In-Prod}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
