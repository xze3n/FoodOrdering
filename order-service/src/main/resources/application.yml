server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5435/orderdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT configuration — used to validate tokens issued by user-service
jwt:
  secret: ${JWT_SECRET:S3cr3tK3yF0rJWTAuthThatIsAtLeast256BitsL0ng!!Change-In-Prod}

# Inter-service communication — student 3 uses this base URL to call menu-service
menu:
  service:
    url: http://${MENU_SERVICE_HOST:localhost}:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
